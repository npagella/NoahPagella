<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah Pagella — Short Form Video</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --text:#1a1a1a;
  --muted:#555;
  --accent:#1e90ff;
  --bg-main:#f0f2f5;
  --bg-alt:#f8f9fb;
  --border:#e0e0e0;
}

body.dark{
  --text:#f1f1f1;
  --muted:#bbb;
  --accent:#4dabff;
  --bg-main:#121212;
  --bg-alt:#1a1a1a;
  --border:#2a2a2a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:linear-gradient(to bottom,var(--bg-main),var(--bg-alt));
  color:var(--text);
  line-height:1.7;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:2rem 1.5rem;
}

header{
  position:sticky;
  top:0;
  background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--border);
  z-index:1000;
}

body.dark header{
  background:rgba(18,18,18,.95);
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:1.5rem;
  font-weight:700;
}

.nav-links{
  display:flex;
  list-style:none;
  gap:2rem;
}

.nav-links a{
  text-decoration:none;
  color:var(--text);
  font-weight:500;
}

.nav-links a:hover{
  color:var(--accent);
}

.hamburger{
  display:none;
  flex-direction:column;
  gap:4px;
  background:none;
  border:none;
  cursor:pointer;
}

.hamburger span{
  width:25px;
  height:3px;
  background:var(--text);
  border-radius:2px;
}

.dark-toggle{
  margin-left:1rem;
  background:none;
  border:none;
  font-size:1.2rem;
  cursor:pointer;
}

.hero{
  padding:6rem 0 3rem;
}

.hero h2{
  font-size:3rem;
  margin-bottom:1rem;
}

.hero p{
  max-width:700px;
  color:var(--muted);
}

.short-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:2rem;
  margin-top:3rem;
}

.short-card{
  background:rgba(255,255,255,.6);
  border:1px solid var(--border);
  border-radius:20px;
  padding:1rem;
  backdrop-filter:blur(10px);
}

body.dark .short-card{
  background:rgba(255,255,255,.03);
}

.short-card iframe{
  width:100%;
  aspect-ratio:9/16;
  border:none;
  border-radius:18px;
  background:#000;
}

.instagram-media{
  width:100% !important;
  min-width:100% !important;
  margin:0 !important;
}

.short-card h4{
  margin-top:1rem;
  text-align:center;
}

footer{
  text-align:center;
  padding:2rem;
  margin-top:4rem;
  border-top:1px solid var(--border);
  color:var(--muted);
}

@media(max-width:850px){

  .nav-links{
    position:absolute;
    top:100%;
    right:1rem;
    width:220px;
    background:var(--bg-main);
    flex-direction:column;
    display:none;
    padding:1.25rem;
    border:1px solid var(--border);
    border-radius:12px;
  }

  .nav-links.open{
    display:flex;
  }

  .hamburger{
    display:flex;
  }

  .hero h2{
    font-size:2.2rem;
  }
}
</style>
</head>

<body>

<header>
  <nav class="container">

    <h1 class="logo">Noah Pagella</h1>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="photography.html">Photography</a></li>
      <li><a href="video.html">Video</a></li>
      <li><a href="writing.html">Writing</a></li>
      <li><a href="shortform.html">Short Form</a></li>
    </ul>

    <div style="display:flex;align-items:center;">
      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <button class="dark-toggle" id="darkToggle">🌙</button>
    </div>

  </nav>
</header>

<main class="container">

<section class="hero">
  <h2>Short Form Video</h2>
  <p>
    Social-first storytelling, vertical video production, and engaging short-form content built for modern digital platforms.
  </p>
</section>

<section class="short-grid">

  <div class="short-card">
    <iframe
      src="https://www.youtube.com/embed/JQvQbzQLu7o"
      title="Testimonials"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
      loading="lazy">
    </iframe>
    <h4>Testimonials</h4>
  </div>

  <div class="short-card">
    <blockquote
      class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/p/DWjWZ0xjXZT/"
      data-instgrm-version="14">
    </blockquote>
    <h4>Business Showcase</h4>
  </div>

  <div class="short-card">
    <blockquote
      class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/p/DQKmGR1j8UC/"
      data-instgrm-version="14">
    </blockquote>
    <h4>Social Media Reel</h4>
  </div>

</section>

</main>

<footer>
  © <span id="year"></span> Noah Pagella
</footer>

<script async src="https://www.instagram.com/embed.js"></script>

<script>
document.getElementById("year").textContent =
  new Date().getFullYear();

const hamburger =
  document.getElementById("hamburger");

const navLinks =
  document.getElementById("navLinks");

hamburger.addEventListener("click", () => {
  navLinks.classList.toggle("open");
});

const darkToggle =
  document.getElementById("darkToggle");

if(localStorage.getItem("theme")==="dark"){
  document.body.classList.add("dark");
  darkToggle.textContent="☀️";
}

darkToggle.addEventListener("click", ()=>{

  document.body.classList.toggle("dark");

  const isDark =
    document.body.classList.contains("dark");

  darkToggle.textContent =
    isDark ? "☀️" : "🌙";

  localStorage.setItem(
    "theme",
    isDark ? "dark" : "light"
  );
});
</script>

</body>
</html>
