<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah Pagella — Short Form Video</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --text:#1a1a1a;
  --muted:#555;
  --accent:#1e90ff;
  --bg-main:#f0f2f5;
  --bg-alt:#f8f9fb;
  --border:#e0e0e0;
}

body.dark {
  --text:#f1f1f1;
  --muted:#bbb;
  --accent:#4dabff;
  --bg-main:#121212;
  --bg-alt:#1a1a1a;
  --border:#2a2a2a;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Inter,sans-serif;
  background:linear-gradient(to bottom,var(--bg-main),var(--bg-alt));
  color:var(--text);
  line-height:1.7;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:2rem 1.5rem;
}

header {
  position:sticky;
  top:0;
  background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--border);
  z-index:1000;
}

body.dark header {
  background:rgba(18,18,18,.95);
}

nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  font-size:1.5rem;
  font-weight:700;
}

.nav-links {
  display:flex;
  list-style:none;
  gap:2rem;
}

.nav-links a {
  text-decoration:none;
  color:var(--text);
  font-weight:500;
}

.nav-links a:hover {
  color:var(--accent);
}

.hamburger {
  display:none;
  flex-direction:column;
  gap:4px;
  background:none;
  border:none;
  cursor:pointer;
}

.hamburger span {
  width:25px;
  height:3px;
  background:var(--text);
  border-radius:2px;
}

.dark-toggle {
  margin-left:1rem;
  background:none;
  border:none;
  font-size:1.2rem;
  cursor:pointer;
}

.hero {
  padding:6rem 0 3rem;
}

.hero h2 {
  font-size:3rem;
  margin-bottom:1rem;
}

.hero p {
  color:var(--muted);
  max-width:700px;
}

.short-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:2rem;
  margin-top:3rem;
}

.short-card iframe {
  width:100%;
  aspect-ratio:9/16;
  border:none;
  border-radius:18px;
  background:#000;
}

.short-card h4 {
  margin-top:1rem;
  font-size:1rem;
}

footer {
  text-align:center;
  padding:2rem;
  border-top:1px solid var(--border);
  margin-top:4rem;
  color:var(--muted);
}

@media(max-width:850px){

  .nav-links{
    position:absolute;
    top:100%;
    right:0;
    width:220px;
    background:var(--bg-main);
    flex-direction:column;
    padding:1.25rem;
    display:none;
    border:1px solid var(--border);
    border-radius:12px;
  }

  .nav-links.open {
    display:flex;
  }

  .hamburger {
    display:flex;
  }
}
</style>
</head>
<body>

<header>
  <nav class="container">
    <h1 class="logo">Noah Pagella</h1>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="photography.html">Photography</a></li>
      <li><a href="video.html">Video</a></li>
      <li><a href="shortform.html">Short Form</a></li>
      <li><a href="writing.html">Writing</a></li>
    </ul>

    <div style="display:flex;align-items:center;">
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>

      <button class="dark-toggle" id="darkToggle">🌙</button>
    </div>
  </nav>
</header>

<main class="container">

<section class="hero">
  <h2>Short Form Video</h2>
  <p>
    Vertical storytelling, social-first edits, and short-form multimedia content created for modern digital platforms.
  </p>
</section>

<section class="short-grid">

  <div class="short-card">
    <iframe
      src="https://www.youtube.com/embed/VIDEO_ID_1"
      title="Short Form Video 1"
      allowfullscreen
      loading="lazy">
    </iframe>
    <h4>Campus Event Recap</h4>
  </div>

  <div class="short-card">
    <iframe
      src="https://www.youtube.com/embed/VIDEO_ID_2"
      title="Short Form Video 2"
      allowfullscreen
      loading="lazy">
    </iframe>
    <h4>Community Spotlight</h4>
  </div>

  <div class="short-card">
    <iframe
      src="https://www.youtube.com/embed/VIDEO_ID_3"
      title="Short Form Video 3"
      allowfullscreen
      loading="lazy">
    </iframe>
    <h4>Social Media Reel</h4>
  </div>

</section>

</main>

<footer>
  © <span id="year"></span> Noah Pagella
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const hamburger = document.getElementById("hamburger");
const navLinks = document.getElementById("navLinks");

hamburger.addEventListener("click", () => {
  navLinks.classList.toggle("open");
});

const darkToggle = document.getElementById("darkToggle");

if(localStorage.getItem("theme")==="dark"){
  document.body.classList.add("dark");
  darkToggle.textContent="☀️";
}

darkToggle.addEventListener("click", ()=>{
  document.body.classList.toggle("dark");

  const isDark = document.body.classList.contains("dark");

  darkToggle.textContent = isDark ? "☀️" : "🌙";

  localStorage.setItem("theme", isDark ? "dark" : "light");
});
</script>

</body>
</html>
