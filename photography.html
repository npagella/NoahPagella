<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography — Noah Pagella</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"> <!-- if you later move CSS to its own file -->
<style>
body {
  font-family: Inter, sans-serif;
  margin:0;
  background:#f0f2f5;
  color:#1a1a1a;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:3rem 1.5rem;
}

header {
  border-bottom:1px solid #e0e0e0;
  padding:1.5rem 0;
}

.logo {
  font-size:1.6rem;
  font-weight:700;
}

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  margin-top:3rem;
}

.gallery img {
  width:100%;
  border-radius:12px;
  transition:transform .3s ease;
}

.gallery img:hover {
  transform:scale(1.03);
}

.caption {
  font-size:.9rem;
  color:#555;
  margin-top:.5rem;
}
</style>
</head>
<body>

<header class="container">
  <div class="logo">Noah Pagella</div>
</header>

<div class="container">
  <h1>Photography</h1>
  <p>Visual storytelling through documentary, community, and editorial photography.</p>

  <div class="gallery">
    <div>
      <img src="photo1.jpg" alt="Description of photo">
      <div class="caption">Caption describing the story context.</div>
    </div>
    <div>
      <img src="photo2.jpg" alt="Description of photo">
      <div class="caption">Caption describing the story context.</div>
    </div>
    <div>
      <img src="photo3.jpg" alt="Description of photo">
      <div class="caption">Caption describing the story context.</div>
    </div>
  </div>
</div>

</body>
</html>
