<style>
:root {
  --text:#1a1a1a;
  --muted:#555;
  --accent:#1e90ff;
  --bg-main:#f0f2f5;
  --bg-alt:#f8f9fb;
  --border:#e0e0e0;
  --card:#ffffff;
}
body.dark {
  --text:#f1f1f1;
  --muted:#bbb;
  --accent:#4dabff;
  --bg-main:#121212;
  --bg-alt:#1a1a1a;
  --border:#2a2a2a;
  --card:#1e1e1e;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(to bottom,var(--bg-main),var(--bg-alt));color:var(--text);line-height:1.7;transition:background .3s,color .3s;}
.container{max-width:1100px;margin:auto;padding:2rem 1.5rem;}
header{position:sticky;top:0;background:rgba(255,255,255,.95);border-bottom:1px solid var(--border);z-index:1000;transition:background .3s;}
body.dark header{background:rgba(18,18,18,.95);}
nav{display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:1.6rem;font-weight:700;}
.nav-links{list-style:none;display:flex;gap:2rem;}
.nav-links a{text-decoration:none;color:var(--text);font-weight:500;}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--accent);}
.hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;background:none;border:none;}
.hamburger span{width:25px;height:3px;background:var(--text);border-radius:2px;transition:.3s;}
.dark-toggle{margin-left:1rem;cursor:pointer;font-size:1.2rem;background:none;border:none;}
.section{padding:5rem 1.5rem;border-top:1px solid var(--border);}
.section:nth-of-type(even){background:var(--bg-alt);}
.section h3{font-size:2.2rem;margin-bottom:2.5rem;}
.section h3::before{content:"";display:block;width:70px;height:3px;background:var(--accent);margin-bottom:1rem;}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.25rem;}
.skill-card{background:var(--card);padding:1.25rem;border-radius:14px;text-align:center;font-weight:600;}
.footer{padding:2.5rem 1.5rem;text-align:center;color:var(--muted);border-top:1px solid var(--border);}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;}
.project-card{overflow:hidden;border-radius:12px;position:relative;}
.project-card img{width:100%;height:auto;display:block;border-radius:12px;}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease, transform .6s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}
@media(max-width:850px){
  .nav-links{position:absolute;top:100%;right:0;background:var(--bg-main);flex-direction:column;width:220px;padding:1.25rem;display:none;border:1px solid var(--border);border-radius:12px;}
  .nav-links.open{display:flex;}
  .hamburger{display:flex;}
}
</style>
</head>

        <li><a href="#photography">Photography</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <button class="dark-toggle" id="darkToggle">🌙</button>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>
</header>
