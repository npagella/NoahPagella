<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Noah Pagella</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="container">
      <h1 class="logo">Noah Pagella</h1>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="video.html">Video</a></li>
        <li><a href="writing.html">Writing</a></li>
      </ul>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      <button class="dark-toggle" id="darkToggle">🌙</button>
    </nav>
  </header>

  <main>
    <section class="container section">
      <h3>Photography</h3>
      <div class="photo-grid">
        <div class="photo-card"><img src="Skate.jpg" alt="Skate Photo"></div>
        <div class="photo-card"><img src="Lbus.jpg" alt="Lbus Photo"></div>
        <div class="photo-card"><img src="volunteer.jpg" alt="Volunteer Photo"></div>
      </div>
    </section>
  </main>

  <footer>© <span id="year"></span> Noah Pagella</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const hamburger = document.getElementById("hamburger");
    const navLinks = document.getElementById("navLinks");
    hamburger.addEventListener("click",()=>navLinks.classList.toggle("open"));
    const darkToggle = document.getElementById("darkToggle");
    const body = document.body;
    if(localStorage.getItem("theme")==="dark"){ body.classList.add("dark"); darkToggle.textContent="☀️"; }
    darkToggle.addEventListener("click",()=>{
      body.classList.toggle("dark");
      const isDark = body.classList.contains("dark");
      darkToggle.textContent = isDark?"☀️":"🌙";
      localStorage.setItem("theme", isDark?"dark":"light");
    });
  </script>
</body>
</html>
